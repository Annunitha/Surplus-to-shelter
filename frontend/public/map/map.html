<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Food Help Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .route-panel {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #d7d2c7;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 10px 12px;
            min-width: 170px;
            backdrop-filter: blur(8px);
        }

        .route-panel .label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6f6c64;
            font-weight: 700;
        }

        .route-panel .value {
            margin-top: 4px;
            font-size: 24px;
            font-weight: 800;
            color: #22211e;
            line-height: 1.1;
        }

        .route-panel .sub {
            margin-top: 2px;
            font-size: 11px;
            color: #6f6c64;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="route-panel" id="routePanel">
        <div class="label">Distance to Recipient</div>
        <div class="value" id="distanceValue">--</div>
        <div class="sub" id="distanceSub">waiting for route data</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);

        const driverLat = parseFloat(params.get('driverLat'));
        const driverLng = parseFloat(params.get('driverLng'));
        const pickupLat = parseFloat(params.get('pickupLat'));
        const pickupLng = parseFloat(params.get('pickupLng'));
        const dropoffLat = parseFloat(params.get('dropoffLat'));
        const dropoffLng = parseFloat(params.get('dropoffLng'));

        const map = L.map('map', { zoomControl: true }).setView([9.9252, 78.1198], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function toRad(value) {
            return (value * Math.PI) / 180;
        }

        function haversineKm(lat1, lng1, lat2, lng2) {
            const earthRadiusKm = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return earthRadiusKm * c;
        }

        function buildDistanceText(distanceMeters) {
            if (!Number.isFinite(distanceMeters)) return 'Distance unavailable';
            if (distanceMeters < 1000) {
                return `${Math.round(distanceMeters)} m`;
            }
            return `${(distanceMeters / 1000).toFixed(1)} km`;
        }

        async function fetchRoadRoute(fromLat, fromLng, toLat, toLng) {
            const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson&steps=false`;

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Routing request failed');
            }

            const data = await response.json();
            const route = data.routes && data.routes[0];
            if (!route) {
                throw new Error('No route available');
            }

            const path = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
            return {
                distanceMeters: route.distance,
                path
            };
        }

        async function renderDrivingRoute(fromLat, fromLng, toLat, toLng, label) {
            try {
                const route = await fetchRoadRoute(fromLat, fromLng, toLat, toLng);
                document.getElementById('distanceValue').textContent = buildDistanceText(route.distanceMeters);
                document.getElementById('distanceSub').textContent = label;

                const routeLine = L.polyline(route.path, {
                    color: '#5F684B',
                    weight: 5,
                    opacity: 0.9,
                    lineCap: 'round'
                }).addTo(map);

                routeLine.bindPopup(`<b>${label}</b><br>${buildDistanceText(route.distanceMeters)}`);
                return;
            } catch (error) {
                console.warn('Falling back to straight-line distance:', error);
            }

            const fallbackDistance = haversineKm(fromLat, fromLng, toLat, toLng) * 1000;
            document.getElementById('distanceValue').textContent = buildDistanceText(fallbackDistance);
            document.getElementById('distanceSub').textContent = `${label} (approx.)`;

            const fallbackLine = L.polyline([
                [fromLat, fromLng],
                [toLat, toLng]
            ], {
                color: '#5F684B',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 8'
            }).addTo(map);

            fallbackLine.bindPopup(`<b>${label}</b><br>${buildDistanceText(fallbackDistance)}`);
        }

        const hasDriver = Number.isFinite(driverLat) && Number.isFinite(driverLng);
        const hasPickup = Number.isFinite(pickupLat) && Number.isFinite(pickupLng);
        const hasDropoff = Number.isFinite(dropoffLat) && Number.isFinite(dropoffLng);

        if (hasDriver || hasPickup || hasDropoff) {
            const points = [];
            if (hasDriver) points.push([driverLat, driverLng]);
            if (hasPickup) points.push([pickupLat, pickupLng]);
            if (hasDropoff) points.push([dropoffLat, dropoffLng]);
            const bounds = L.latLngBounds(points);
            map.fitBounds(bounds.pad(0.3));
        }

        const driverIcon = L.divIcon({
            html: '🚚',
            className: 'leaflet-marker-icon',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        const donorIcon = L.divIcon({
            html: '📦',
            className: 'leaflet-marker-icon',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        const recipientIcon = L.divIcon({
            html: '🏠',
            className: 'leaflet-marker-icon',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        if (hasDriver) {
            const driverMarker = L.marker([driverLat, driverLng], { icon: driverIcon }).addTo(map);
            driverMarker.bindPopup('<b>Driver</b><br>Current location');
        }

        if (hasPickup) {
            const pickupMarker = L.marker([pickupLat, pickupLng], { icon: donorIcon }).addTo(map);
            pickupMarker.bindPopup('<b>Pickup</b><br>Donor location');
        }

        if (hasDropoff) {
            const dropoffMarker = L.marker([dropoffLat, dropoffLng], { icon: recipientIcon }).addTo(map);
            dropoffMarker.bindPopup('<b>Recipient</b><br>Shelter location');
        }

        if (hasDriver && hasDropoff) {
            renderDrivingRoute(driverLat, driverLng, dropoffLat, dropoffLng, 'to recipient shelter');
        } else if (hasPickup && hasDropoff) {
            renderDrivingRoute(pickupLat, pickupLng, dropoffLat, dropoffLng, 'route distance');
        } else {
            const defaultLocations = [
                { name: 'Free Food Center', lat: 9.9252, lng: 78.1198 },
                { name: 'Community Kitchen', lat: 9.9300, lng: 78.1250 },
                { name: 'Food Donation Point', lat: 9.9180, lng: 78.1100 },
                { name: 'Free Meal Distribution', lat: 9.9350, lng: 78.1150 }
            ];

            defaultLocations.forEach(function (place) {
                L.marker([place.lat, place.lng]).addTo(map).bindPopup('<b>🍱 ' + place.name + '</b><br>Food help available here.');
            });
        }
    </script>

</body>

</html>
