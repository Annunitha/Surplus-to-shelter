<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Food Help Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
        }

        /* Shelter icon */
        .shelter-icon {
            font-size: 28px;
            text-align: center;
            line-height: 40px;
        }
    </style>
</head>

<body>

    <h2>🍱 Food Help Map</h2>

    <div class="search-box">

        <input
            type="text"
            id="placeInput"
            placeholder="Search a place...">

        <button onclick="searchPlace()">
            🔍 Search
        </button>

    </div>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // Starting position
        const map = L.map("map").setView(
            [9.9252, 78.1198],
            13
        );


        // OpenStreetMap
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // Custom shelter icon
        const shelterIcon = L.divIcon({

            html: "🏠🍱",

            className: "shelter-icon",

            iconSize: [45, 45],

            iconAnchor: [22, 40]

        });


        // =====================================
        // MULTIPLE FOOD HELP LOCATIONS
        // =====================================

        const shelters = [

            {
                name: "Food Help Shelter 1",
                lat: 9.9252,
                lng: 78.1198
            },

            {
                name: "Food Help Shelter 2",
                lat: 9.9300,
                lng: 78.1250
            },

            {
                name: "Food Help Shelter 3",
                lat: 9.9180,
                lng: 78.1100
            },

            {
                name: "Food Help Shelter 4",
                lat: 9.9350,
                lng: 78.1150
            },

            {
                name: "Food Help Shelter 5",
                lat: 9.9150,
                lng: 78.1280
            },

            {
                name: "Food Help Shelter 6",
                lat: 9.9400,
                lng: 78.1050
            },

            {
                name: "Food Help Shelter 7",
                lat: 9.9100,
                lng: 78.1180
            }

        ];


        // Add ALL shelters to map
        shelters.forEach(function(shelter) {

            L.marker(

                [shelter.lat, shelter.lng],

                {
                    icon: shelterIcon
                }

            )
            .addTo(map)

            .bindPopup(
                "<b>🏠🍱 " +
                shelter.name +
                "</b><br>" +
                "Food assistance available"
            );

        });


        // =====================================
        // SEARCH A PLACE
        // =====================================

        async function searchPlace() {

            const place =
                document.getElementById("placeInput").value;


            if (place === "") {

                alert("Please enter a place.");

                return;
            }


            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=json&q=" +
                encodeURIComponent(place);


            try {

                const response =
                    await fetch(url);

                const data =
                    await response.json();


                if (data.length === 0) {

                    alert("Place not found.");

                    return;
                }


                const latitude =
                    parseFloat(data[0].lat);

                const longitude =
                    parseFloat(data[0].lon);


                // Move map
                map.setView(
                    [latitude, longitude],
                    15
                );


                // Add a new shelter marker
                L.marker(

                    [latitude, longitude],

                    {
                        icon: shelterIcon
                    }

                )
                .addTo(map)

                .bindPopup(
                    "<b>🏠🍱 Food Help Shelter</b><br>" +
                    data[0].display_name
                )
                .openPopup();

            }

            catch (error) {

                console.log(error);

                alert(
                    "Something went wrong. " +
                    "Check your internet connection."
                );

            }

        }

    </script>

</body>

</html>
